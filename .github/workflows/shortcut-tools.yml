name: Shortcut tools

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operation to run
        required: true
        type: choice
        options:
          - extract
          - sign

permissions:
  contents: read

jobs:
  shortcut:
    runs-on: macos-15
    steps:
      - name: Decode temporary shortcut
        env:
          SHORTCUT_BASE64: ${{ secrets.TEMP_SHORTCUT_BASE64 }}
        run: |
          test -n "$SHORTCUT_BASE64"
          printf '%s' "$SHORTCUT_BASE64" | base64 --decode > input.shortcut

      - name: Extract signed shortcut
        if: inputs.mode == 'extract'
        run: |
          set +e
          mkdir extracted
          python3 - <<'PY'
          import plistlib
          import struct

          with open('input.shortcut', 'rb') as shortcut_file:
              shortcut = shortcut_file.read()
          auth_length = struct.unpack_from('<I', shortcut, 8)[0]
          auth = plistlib.loads(shortcut[12:12 + auth_length])
          with open('signing-certificate.der', 'wb') as certificate_file:
              certificate_file.write(auth['SigningCertificateChain'][0])
          PY
          openssl x509 -inform DER -in signing-certificate.der -pubkey -noout > signing-public.pem
          aea decrypt -i input.shortcut -o input.aar -sign-pub signing-public.pem > extraction.log 2>&1
          decrypt_status=$?
          if [ "$decrypt_status" -eq 0 ]; then
            aa extract -i input.aar -d extracted >> extraction.log 2>&1
          fi
          {
            echo '### Shortcut extraction diagnostics'
            echo '```text'
            cat extraction.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          find extracted -type f -print || true

      - name: Sign unsigned shortcut
        if: inputs.mode == 'sign'
        run: shortcuts sign --mode anyone --input input.shortcut --output UltraPilot-Health-Sync.shortcut

      - name: Upload extracted shortcut
        if: inputs.mode == 'extract'
        uses: actions/upload-artifact@v4
        with:
          name: shortcut-extracted
          path: extracted
          if-no-files-found: warn
          retention-days: 1

      - name: Upload signed shortcut
        if: inputs.mode == 'sign'
        uses: actions/upload-artifact@v4
        with:
          name: shortcut-signed
          path: UltraPilot-Health-Sync.shortcut
          if-no-files-found: error
          retention-days: 1
